
name: Build Homelander Powers v2.1

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build mod
        run: gradle --no-daemon clean build

      - name: Show generated files
        run: ls -lah build/libs/

      - name: Upload Minecraft Mod
        uses: actions/upload-artifact@v4
        with:
          name: Homelander-Powers-v2.1
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
          if-no-files-found: error
